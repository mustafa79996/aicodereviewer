services:
  - type: web
    name: ai-code-reviewer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEFAULT_AI_PROVIDER
        value: built-in
